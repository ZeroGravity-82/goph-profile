name: goph-profile-test

services:
  postgresql-test:
    image: postgres:17
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: ${GOPH_PROFILE_TEST_POSTGRES_DB:?}
      POSTGRES_USER: ${GOPH_PROFILE_TEST_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${GOPH_PROFILE_TEST_POSTGRES_PASSWORD:?}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GOPH_PROFILE_TEST_POSTGRES_USER:?} -d ${GOPH_PROFILE_TEST_POSTGRES_DB:?}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-test:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: ${GOPH_PROFILE_TEST_MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${GOPH_PROFILE_TEST_MINIO_ROOT_PASSWORD:?}
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq-test:
    image: rabbitmq:3.13-management
    ports:
      - "15673:5672"
      - "25672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${GOPH_PROFILE_TEST_RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${GOPH_PROFILE_TEST_RABBITMQ_PASSWORD:?}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
