name: goph-profile-test

services:
  postgresql-test:
    image: postgres:17
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: gophprofile_test
      POSTGRES_USER: gophprofile
      POSTGRES_PASSWORD: userpassword
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophprofile -d gophprofile_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-test:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: gophprofile
      MINIO_ROOT_PASSWORD: userpassword
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq-test:
    image: rabbitmq:3.13-management
    ports:
      - "15672:5672"
      - "25672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: gophprofile
      RABBITMQ_DEFAULT_PASS: userpassword
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
