services:
  postgresql:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gophprofile
      POSTGRES_USER: gophprofile
      POSTGRES_PASSWORD: userpassword
    volumes:
      - postgresql-data:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophprofile -d gophprofile"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000' # Порт для API (S3)
      - '9001:9001' # Порт для веб-консоли управления
    environment:
      MINIO_ROOT_USER: gophkeeper
      MINIO_ROOT_PASSWORD: gophkeeperpassword
    volumes:
      - minio-data:/data:rw
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgresql-data:
  minio-data:
