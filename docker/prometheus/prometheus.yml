global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692

  - job_name: minio
    metrics_path: /minio/metrics/v3
    static_configs:
      - targets:
          - minio:9000

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
