apiVersion: 1

datasources:
  - name: Prometheus
    # UID фиксируется, чтобы JSON-дашборды могли ссылаться на datasource без зависимости от внутреннего ID Grafana.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
