# Скопируйте файл в values.secret.yaml и замените заглушки. values.secret.yaml не коммитится в Git.
secret:
  databaseURI: postgres://replace-with-user:replace-with-password@replace-with-host:5432/gophprofile?sslmode=require
  fileStorageAccessKey: replace-with-access-key
  fileStorageSecretKey: replace-with-secret-key
  queueURL: amqp://replace-with-user:replace-with-password@replace-with-host:5672/

tls:
  certificate: |
    replace-with-tls-certificate
  privateKey: |
    replace-with-tls-private-key
