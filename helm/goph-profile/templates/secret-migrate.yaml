apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goph-profile.migrateName" . }}
  labels:
    {{- include "goph-profile.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  GOPH_PROFILE_DATABASE_URI: {{ .Values.secret.databaseURI | quote }}
