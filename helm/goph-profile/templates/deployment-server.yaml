apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goph-profile.fullname" . }}-server
  labels:
    {{- include "goph-profile.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "goph-profile.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret-credentials.yaml") . | sha256sum }}
        checksum/tls: {{ include (print $.Template.BasePath "/secret-server-tls.yaml") . | sha256sum }}
      labels:
        {{- include "goph-profile.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: {{ include "goph-profile.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/server
          ports:
            - name: https
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "goph-profile.configMapName" . }}
            - secretRef:
                name: {{ include "goph-profile.secretName" . }}
          env:
            - name: GOPH_PROFILE_HTTP_ADDRESS
              value: {{ printf "0.0.0.0:%v" .Values.server.port | quote }}
            - name: GOPH_PROFILE_TLS_CERT
              value: /app/certs/tls.crt
            - name: GOPH_PROFILE_TLS_KEY
              value: /app/certs/tls.key
            - name: OTEL_SERVICE_NAME
              value: goph-profile-server
          volumeMounts:
            - name: tls
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ include "goph-profile.tlsSecretName" . }}
