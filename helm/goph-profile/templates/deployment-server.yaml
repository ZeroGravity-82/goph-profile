apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goph-profile.fullname" . }}-server
  labels:
    {{- include "goph-profile.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    matchLabels:
      {{- include "goph-profile.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-app.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret-credentials.yaml") . | sha256sum }}
      labels:
        {{- include "goph-profile.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "goph-profile.fullname" . }}-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "goph-profile.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /app/server
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "goph-profile.configMapName" . }}
            - secretRef:
                name: {{ include "goph-profile.secretName" . }}
          env:
            - name: GOPH_PROFILE_HTTP_ADDRESS
              value: {{ printf "0.0.0.0:%v" .Values.server.port | quote }}
            - name: GOPH_PROFILE_TLS_CERT
              value: ""
            - name: GOPH_PROFILE_TLS_KEY
              value: ""
            - name: OTEL_SERVICE_NAME
              value: goph-profile-server
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ include "goph-profile.otelResourceAttributes" . | quote }}
