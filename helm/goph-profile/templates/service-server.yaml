apiVersion: v1
kind: Service
metadata:
  name: {{ include "goph-profile.fullname" . }}-server
  labels:
    {{- include "goph-profile.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "goph-profile.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
