{{- if and .Values.networkPolicy.enabled .Values.otelCollector.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "goph-profile.otelCollectorName" . }}
  labels:
    {{- include "goph-profile.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  podSelector:
    matchLabels:
      {{- include "goph-profile.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-collector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - server
                  - worker
            matchLabels:
              {{- include "goph-profile.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.otelCollector.ports.otlpGrpc }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheus.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.prometheus.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.otelCollector.ports.metrics }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: {{ .Values.networkPolicy.ports.opensearch }}
          protocol: TCP
        - port: {{ .Values.networkPolicy.ports.jaeger }}
          protocol: TCP
{{- end }}
